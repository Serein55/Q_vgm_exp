# Failure-mode diagnosis of the SFT baseline on task 9, the single biggest failure source
# (41 of the baseline's 100 failed episodes; 9/50 success).
# Derived from libero_spatial_sft_eval_fullsuite.yaml; only the eval pool, wave count, GPU
# placement and video settings change. Policy is the frozen RLinf-Pi05-LIBERO-SFT weights with
# optim.lr=0, so what is recorded is exactly the baseline behaviour that scored t9 9/50.
#
# Shape rationale: task_id_filter=[9] -> pool = 50 ordered states (task order not
# interleaved, see libero_env.py:533-543). 50 % env_world_size(2) == 0 -> 25 states per worker,
# and total_num_envs=50 -> 25 envs per worker, so each env runs exactly one episode in a single
# 240-step wave. 25 envs/worker is the per-GPU load already measured safe (~60GiB of 79GiB);
# 63 envs/worker OOMs. Only 2 GPUs because 50 % 4 != 0 and padding with -1 crashes at init.
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_sft_diag_t9"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: 1
  only_eval: False
  val_check_interval: 1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"

  # train side stays unfiltered and identical to the baseline config; it only performs one
  # no-op step (optim.lr=0) so the runner's train+eval loop executes and triggers the eval.
  train:
    rollout_epoch: 1
    total_num_envs: 64
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    video_cfg:
      save_video: False
  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    specific_reset_id: null
    use_ordered_reset_state_ids: True
    task_id_filter: [9]
    video_cfg:
      save_video: True
      info_on_video: True
      # mp4 filenames are just a per-seed counter (record_video.py:453-459), so burn the
      # identity into the frames instead of reconstructing it from reset-state ordering.
      extra_info_on_video: ["episode.task_id", "episode.trial_id", "episode.success_once"]
      video_base_dir: ${runner.logger.log_path}/video/diag_t9

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "/pfs/pfs-oHNwH0/ganrenda/RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 1024
  seed: 42
  enable_offload: True

  model:
    model_path: "/pfs/pfs-oHNwH0/ganrenda/RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT"
    model_type: "openpi"
    num_action_chunks: 5
    num_steps: 3
    add_value_head: True
    openpi:
      value_after_vlm: True

  optim:
    lr: 0.0
    value_lr: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
