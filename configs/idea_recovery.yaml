extends: libero_spatial_checkpoint.yaml
# Experimental recovery branch, not a paper reproduction.
recovery:
  run: idea_recovery_v1
  source_run: spatial_paper_checkpoint
  task_ids: [1, 9]
  episodes: 6
  fractions: [0.0, 0.5]
  repeats: 2
  workers: 3
  train_episodes: [0, 1, 2]
  validation_episodes: [3]
  test_episodes: [4, 5]
  # Radii in unnormalized controller-input coordinates, NOT meters/radians.
  action_radii: [0.04, 0.04, 0.04, 0.012, 0.012, 0.012, 0.03]
  trust_radius: 1.0
  critic_steps: 600
  critic_lr: 0.001
  critic_heads: 3
  actor_steps: 100
  actor_lr: 0.0000005
  anchor_weight: 1.0
