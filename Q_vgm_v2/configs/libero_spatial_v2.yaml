version: qvgm_v2
paper: https://arxiv.org/abs/2606.08015v2
# All paths relative to Q_vgm_v2/. This is NOT a v5 config or runnable trainer.
paths:
  python: ../../RLinf/.venv-openpi-robotwin/bin/python
  checkpoint: ../../RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT
  norm_stats: ../../RLinf/checkpoints/RLinf-Pi05-LIBERO-SFT/physical-intelligence/libero/norm_stats.json
  rollout_buffer: artifacts/v2_sft_500/buffer
  demo_source: artifacts/expert_source/libero_spatial
  demo_buffer: artifacts/v2_expert/buffer
  artifacts: artifacts/v2_spatial
model:
  policy_action_horizon: 10
  policy_action_dim: 32
  discrete_state_input: false
  denoising_steps: 10
  critic_horizon: 5
  critic_action_dim: 7
data:
  rollout_episodes_per_task: 50
  use_demos: true
  # Engineering assumptions, not confirmed author settings:
  temperature: 1.0
  flow_noise: 0.0
  timeout_terminal: true  # Finite-horizon task; preserve truncated provenance.
rl_token:
  dim: 2048
  layers: 2
  heads: 8
  heldout_cosine_gate: 0.95
  train_decoder_with_critic: false  # Engineering assumption.
critic:
  q_heads: 2
  widths: [1024, 512]
  proprio_dim: 8
  proprio_embed_dim: 256
  expectile: 0.8
  # Engineering assumptions; budgets/alpha_rec need calibration:
  gamma: 0.99
  lr: 0.0001
  target_ema: 0.005
  alpha_rec: null
  steps: null
  activation: relu
guidance:
  late_steps: 5
  ascent_steps: 3  # Engineering defaults below.
  ascent_step_size: 0.05
  grad_clip: 1.0
actor:
  lr: 0.000005
  batch_size: 8
  steps: 500
  require_critic_environment_gate: true
